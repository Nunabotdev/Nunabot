[project]
name = "nunabot"
version = "0.1.0"
description = "Solana-native GPU bot protocol: reputation-routed compute marketplace for users and AI agents"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "flask-cors>=4.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
